<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page not found - BuaaSignIn</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%233498db'/><stop offset='100%' stop-color='%232a81ba'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23grad)'/><path d='M30,30 L50,50 L70,30 M30,70 L50,50 L70,70' stroke='white' stroke-width='8' stroke-linecap='round' fill='none'/></svg>">
        <style>
            :root {
                --primary-color: #3498db;
                --secondary-color: #2a81ba;
                --text-color: #2d3748;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
                color: var(--text-color);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                text-align: center;
            }

            .container {
                max-width: 500px;
                width: 100%;
            }

            .icon {
                width: 120px;
                height: 120px;
                margin: 0 auto 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
                border-radius: 30px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            }

            .icon svg {
                width: 60px;
                height: 60px;
            }

            .content {
                background: white;
                border-radius: 20px;
                padding: 40px 30px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            }

            h1 {
                font-size: 5rem;
                color: var(--primary-color);
                margin-bottom: 10px;
                font-weight: 700;
            }

            h2 {
                font-size: 1.8rem;
                margin-bottom: 20px;
                color: var(--text-color);
            }

            p {
                font-size: 1.1rem;
                color: #718096;
                margin-bottom: 30px;
                line-height: 1.6;
            }

            .back-link {
                display: inline-block;
                padding: 12px 30px;
                background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
                color: white;
                text-decoration: none;
                border-radius: 50px;
                font-weight: 600;
                transition: all 0.3s ease;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            }

            .back-link:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 4rem;
                }

                h2 {
                    font-size: 1.5rem;
                }

                .content {
                    padding: 30px 20px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30,30 L50,50 L70,30 M30,70 L50,50 L70,70" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" />
                </svg>
            </div>
            <div class="content">
                <h1>404</h1>
                <h2>Page not found</h2>
                <p>Sorry, the page you are trying to access does not exist. Please check if the URL is correct, or return to the homepage.</p>
                <a href="/" class="back-link">Back to Homepage</a>
            </div>
        </div>
    </body>

</html>
