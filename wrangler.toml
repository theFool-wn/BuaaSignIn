# =============================================================================================================
# Cloudflare Worker 配置文件 - BuaaSignIn
# 部署命令: pip install uv && uv sync && uv run pywrangler deploy
# 本地开发: pip install uv && uv sync && uv run pywrangler dev
# =============================================================================================================

name = "buaa-signin"
main = "BuaaSignIn_Worker.py"
compatibility_date = "2026-10-10"
compatibility_flags = ["python_workers"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/health", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "buaa-signin-logs"
database_id = "bc63b07e-0ba3-48d6-8e20-fc01ae870a1e"

[[routes]]
pattern = "sign.wangnan.net"
custom_domain = true

[triggers]
# UTC, at 19:00 on the first day of each month. (UTC+8 03:00 on the second day of each month)
crons = ["0 19 1 * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

[vars]
SERVICE_ENABLED = true
SERVICE_PAUSED_MESSAGE = ""
